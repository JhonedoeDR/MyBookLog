<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定│よみもの記録</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14518c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">

  <header>
    <div class="brand">
      設定
      <span>SETTINGS</span>
    </div>
  </header>

  <main>
    <p class="section-label">バックアップ</p>
    <div class="stack">
      <button type="button" class="btn-sub full-width" id="export-button">バックアップを保存する</button>
      <button type="button" class="btn-sub full-width" id="import-button">バックアップから戻す</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <p class="settings-note">
      メモはこの端末のブラウザ内に保存されています。
      ブラウザのデータを消したり、機種変更をしたりすると、メモも消えます。
      ときどき「バックアップを保存する」を押して、ファイルを残しておくと安心です。
    </p>

    <button type="button" class="btn-main full-width mt-28" id="back-button">ホームに戻る</button>

    <p class="message" id="message"></p>
  </main>

</div>

<script type="module" src="settings.js"></script>
</body>
</html>
