<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>設定│よみもの記録</title>

<!-- Google Fonts -->
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<!-- このページ専用CSS -->
<link
  rel="stylesheet"
  href="settings.css"
>
</head>
<body>
<div class="frame">

  <header>
    <div class="brand">
      設定
      <span>SETTINGS</span>
    </div>
  </header>

  <main>
    <p class="section-label">アカウント</p>
    <div class="settings-card">
      <p>
        メールアドレス：
        <span id="email"></span>
      </p>
    </div>

    <p class="section-label">操作</p>
    <section>
      <button type="button" id="logout-button">
        ログアウト
      </button>
    </section>

    <button type="button" id="back-button">
      ホームに戻る
    </button>

    <p id="message"></p>
  </main>
</div>

<script type="module" src="settings.js"></script>
</body>
</html>
