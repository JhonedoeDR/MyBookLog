<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム│よみもの記録</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14518c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">

  <header>
    <div class="brand">
      よみもの記録
      <span>READING NOTES</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-new-header" id="new-button">＋ 新規作成</button>
      <button type="button" class="icon-btn" id="settings-button">設定</button>
    </div>
  </header>

  <main>
    <div class="left-card">
      <button type="button" class="btn-big" id="create-button">新しいメモを作成</button>
    </div>

    <p class="section-label" data-en="Records"><span>最近の記録</span></p>

    <div id="book-list">
      <p id="empty-message">読み込み中...</p>
    </div>

    <p class="note">メモをタップすると詳細を確認できます。</p>
  </main>

</div>

<script type="module" src="index.js"></script>
</body>
</html>
