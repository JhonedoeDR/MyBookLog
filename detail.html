<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書メモ│よみもの記録</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14518c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">

  <header>
    <div class="brand">
      読書メモ
      <span>DETAIL</span>
    </div>
    <button type="button" class="icon-btn" id="back-button">ホームに戻る</button>
  </header>

  <main>
    <!-- 表示モード -->
    <section id="view-mode">
      <h1 class="book-title" id="view-title">読み込み中...</h1>
      <p class="book-author" id="view-author"></p>

      <p class="section-label">ジャンル</p>
      <p class="info-box" id="view-genre"></p>

      <p class="section-label">進捗</p>
      <p class="info-box" id="view-status"></p>

      <p class="section-label">メモ</p>
      <div id="view-memos"></div>

      <div class="view-actions">
        <button type="button" class="btn-main" id="edit-button" disabled>編集</button>
        <button type="button" class="btn-danger" id="delete-button" disabled>削除</button>
      </div>
    </section>

    <!-- 編集モード -->
    <div id="editor" hidden></div>

    <p class="message" id="notice"></p>
  </main>

</div>

<script type="module" src="detail.js"></script>
</body>
</html>
